name: eatup
description: "EatUp: gobble the town and grow!"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flame: ^1.35.1
  flame_audio: ^2.11.14
  # Pinned: 9.1.0 imports GoogleMobileAds_Beta.h, which breaks the iOS
  # archive ("Include of non-modular header inside framework module").
  google_mobile_ads: 9.0.0
  app_tracking_transparency: ^2.0.7
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_remote_config: ^6.7.0
  in_app_purchase: ^3.3.1
  in_app_review: ^2.0.12
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/audio/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
